<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乔乔竞彩总进球</title>
    <div class="logo-container">
        <img src="/二维码.jpg" alt="乔乔竞彩" class="site-logo">
    </div>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 15px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .logo-container {
            text-align: center;
            margin: 150px 0;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .site-logo {
            width: 200px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .site-logo:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 30px 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 3s infinite;
        }

        .header-card h1 {
            color: #2d3748;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: bounce 2s infinite;
        }

        .header-card h1::before {
            content: '⚽';
            font-size: 32px;
            animation: spin 10s linear infinite;
        }

        .info-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #718096;
            font-size: 14px;
            background: linear-gradient(135deg, #f6f8fc 0%, #edf2f7 100%);
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .update-time {
            color: #48bb78;
            font-size: 13px;
            margin-top: 10px;
            animation: fadeIn 1.2s ease-out 0.5s both;
        }

        .cards-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: slideInLeft 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .stats-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(72, 187, 120, 0.1) 0%, transparent 70%);
            animation: pulse 3s infinite;
        }

        .stats-card .section-title,
        .league-card .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2d3748;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .stats-card .section-title::before {
            content: '📈';
            font-size: 20px;
            animation: bounce 2s infinite;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px 10px;
            background: linear-gradient(135deg, #f6f8fc 0%, #edf2f7 100%);
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .stat-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 2s infinite;
        }

        .stat-label {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }

        .league-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: slideInRight 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .league-card::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: pulse 3s infinite 1s;
        }

        .league-card .section-title::before {
            content: '🏆';
            font-size: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .league-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .league-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: linear-gradient(135deg, #f6f8fc 0%, #edf2f7 100%);
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .league-item:hover {
            transform: translateX(5px);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .league-item:hover .league-name,
        .league-item:hover .league-count {
            color: white;
        }

        .league-name {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2d3748;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .league-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .recommend-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: fadeIn 1s ease-out 0.5s both;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2d3748;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .recommend-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f6f8fc 0%, #edf2f7 100%);
            border-radius: 12px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
            animation: slideInLeft 0.6s ease-out both;
        }

        .recommend-item:nth-child(1) { animation-delay: 0.6s; }
        .recommend-item:nth-child(2) { animation-delay: 0.7s; }
        .recommend-item:nth-child(3) { animation-delay: 0.8s; }

        .recommend-item:hover {
            transform: translateX(10px) scale(1.02);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.25);
            border-left-width: 6px;
        }

        .recommend-item:last-child {
            margin-bottom: 0;
        }

        .match-icon {
            font-size: 24px;
            margin-right: 12px;
            min-width: 30px;
            animation: float 3s ease-in-out infinite;
        }

        .match-info {
            flex: 1;
        }

        .match-name {
            color: #2d3748;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .prediction-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: 200% 200%;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            animation: gradientFlow 3s ease infinite;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .record-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            overflow-x: auto;
            animation: fadeIn 1.2s ease-out 0.7s both;
        }

        .record-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .record-table thead {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            background-size: 200% 200%;
            animation: gradientFlow 5s ease infinite;
            color: white;
        }

        .record-table th {
            padding: 14px 10px;
            text-align: center;
            font-weight: 600;
            white-space: nowrap;
        }

        .record-table td {
            padding: 14px 10px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            color: #4a5568;
            transition: all 0.3s ease;
        }

        .record-table tbody tr {
            transition: all 0.3s ease;
        }

        .record-table tbody tr:hover {
            background: linear-gradient(135deg, #f6f8fc 0%, #edf2f7 100%);
            transform: scale(1.01);
        }

        .record-table tbody tr:last-child td {
            border-bottom: none;
        }

        .status-pending {
            color: #ed8936;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            animation: pulse 2s infinite;
        }

        .win {
            color: #48bb78;
            font-weight: 600;
        }

        .lose {
            color: #f56565;
            font-weight: 600;
        }

        .draw {
            color: #ed8936;
            font-weight: 600;
        }

        .tip-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border-left: 5px solid #f56565;
            animation: fadeIn 1.4s ease-out 0.9s both;
            position: relative;
            overflow: hidden;
        }

        .tip-card::before {
            content: '💡';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 40px;
            opacity: 0.1;
            animation: float 4s ease-in-out infinite;
        }

        .tip-card .section-title::before {
            content: '🚨';
        }

        .tip-content {
            color: #718096;
            font-size: 14px;
            line-height: 1.8;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .tip-content::before {
            content: '⚽';
            font-size: 18px;
            animation: spin 10s linear infinite;
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 30px;
            font-size: 13px;
            animation: fadeIn 1.6s ease-out 1s both;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .footer-heart {
            display: inline-block;
            animation: bounce 1s infinite;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .cards-row {
                grid-template-columns: 1fr;
            }

            .header-card h1 {
                font-size: 22px;
            }

            .info-row {
                flex-direction: column;
                gap: 10px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-value {
                font-size: 24px;
            }

            .recommend-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .prediction-badge {
                align-self: flex-start;
            }

            .record-table {
                font-size: 12px;
            }

            .record-table th,
            .record-table td {
                padding: 10px 5px;
            }
        }

        .loading-dots {
            display: inline-flex;
            gap: 5px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <h1>乔乔竞彩总进球</h1>
            <div class="info-row">
                <div class="info-item">
                    <span>📅</span>
                    <span>统计周期：<span id="period">加载中...</span></span>
                </div>
                <div class="info-item">
                    <span>🏆</span>
                    <span>总场次：<span id="totalMatches">--</span></span>
                </div>
            </div>
            <div class="update-time">
                🔄 更新时间：<span id="updateTime">--</span>
            </div>
        </div>

        <div class="cards-row">
            <div class="stats-card">
                <div class="section-title">胜率统计</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="winRate">--</div>
                        <div class="stat-label">胜率</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalPredict">--</div>
                        <div class="stat-label">预测场次</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="winCount">--</div>
                        <div class="stat-label">命中场次</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="streak">--</div>
                        <div class="stat-label">当前连红</div>
                    </div>
                </div>
            </div>

            <div class="league-card">
                <div class="section-title">热门联赛</div>
                <div class="league-list" id="leagueList">
                    <div class="league-item">
                        <span class="league-name">🏴󠁧󠁥󠁧󠁿󠁿󠁿󠁿󠁿󠁿󠁿 英超</span>
                        <span class="league-count">12 场</span>
                    </div>
                    <div class="league-item">
                        <span class="league-name">🇪🇸 西甲</span>
                        <span class="league-count">10 场</span>
                    </div>
                    <div class="league-item">
                        <span class="league-name">🇮🇹 意甲</span>
                        <span class="league-count">8 场</span>
                    </div>
                    <div class="league-item">
                        <span class="league-name">🇩🇪 德甲</span>
                        <span class="league-count">6 场</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="recommend-card">
            <div class="section-title">今日推荐</div>
            <div id="recommendList">
                <div class="recommend-item">
                    <span class="match-icon">🎯</span>
                    <div class="match-info">
                        <div class="match-name">数据加载中<span class="loading-dots"><span></span><span></span><span></span></span></div>
                    </div>
                    <span class="prediction-badge">加载中</span>
                </div>
            </div>
        </div>

        <div class="record-card">
            <div class="section-title">比赛记录</div>
            <table class="record-table">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>联赛</th>
                        <th>比赛双方</th>
                        <th>比分</th>
                        <th>进球</th>
                        <th>胜否</th>
                    </tr>
                </thead>
                <tbody id="recordBody">
                    <tr>
                        <td colspan="6" style="color: #a0aec0; text-align: center;">
                            加载中<span class="loading-dots"><span></span><span></span><span></span></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="tip-card">
            <div class="section-title">温馨提示</div>
            <div class="tip-content">
                比赛难测，预测多是概率游戏。理性看待，娱乐为主，切勿上头！
            </div>
        </div>

        <div class="footer">
            © 2024 乔乔竞彩 · 仅供娱乐参考 <span class="footer-heart">❤️</span>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('updateTime').textContent = timeStr;
        }
        updateTime();

        function loadData() {
            document.getElementById('period').textContent = '2024-03-10 至 2024-04-10';
            document.getElementById('totalMatches').textContent = '36';
            document.getElementById('winRate').textContent = '78%';
            document.getElementById('totalPredict').textContent = '36';
            document.getElementById('winCount').textContent = '28';
            document.getElementById('streak').textContent = '5';

            const recommendations = [
                { icon: '🔥', name: '016 西班牙人 VS 赫塔费', prediction: '1+2' },
                { icon: '⭐', name: '023 奥萨苏纳 VS 赫罗纳', prediction: '2+3' },
                { icon: '🎖️', name: '025 本菲卡 VS 吉马良斯', prediction: '3+4' }
            ];

            const recommendList = document.getElementById('recommendList');
            recommendList.innerHTML = recommendations.map((item, index) => `
                <div class="recommend-item" style="animation-delay: ${0.6 + index * 0.1}s">
                    <span class="match-icon">${item.icon}</span>
                    <div class="match-info">
                        <div class="match-name">${item.name}</div>
                    </div>
                    <span class="prediction-badge">${item.prediction}</span>
                </div>
            `).join('');

            const records = [
                { date: '03-21', league: '西甲', teams: '西班牙人 vs 赫塔费', score: '未开始', goals: '1+2', result: '待中', status: 'pending' },
                { date: '03-20', league: '英超', teams: '曼城 vs 阿森纳', score: '2-1', goals: '3', result: '胜', status: 'finished' },
                { date: '03-19', league: '西甲', teams: '皇马 vs 巴萨', score: '3-2', goals: '5', result: '胜', status: 'finished' },
                { date: '03-18', league: '意甲', teams: '尤文 vs AC 米兰', score: '1-1', goals: '2', result: '胜', status: 'finished' },
                { date: '03-17', league: '德甲', teams: '拜仁 vs 多特', score: '4-2', goals: '6', result: '负', status: 'finished' }
            ];

            const recordBody = document.getElementById('recordBody');
            recordBody.innerHTML = records.map(record => `
                <tr>
                    <td>${record.date}</td>
                    <td>${record.league}</td>
                    <td>${record.teams}</td>
                    <td>${record.status === 'pending' ? '<span class="status-pending">⏳ 未开始</span>' : record.score}</td>
                    <td>${record.goals}</td>
                    <td class="${record.result === '胜' ? 'win' : record.result === '负' ? 'lose' : 'draw'}">${record.result}</td>
                </tr>
            `).join('');
        }

        loadData();

        function animateValue(element, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                element.textContent = Math.floor(progress * (end - start) + start) + (element.id === 'winRate' ? '%' : '');
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                animateValue(document.getElementById('winRate'), 0, 78, 1500);
                animateValue(document.getElementById('totalPredict'), 0, 36, 1500);
                animateValue(document.getElementById('winCount'), 0, 28, 1500);
                animateValue(document.getElementById('streak'), 0, 5, 1000);
            }, 1000);
        });
    </script>

    <!-- ✅ 新增：Identity 回调处理 -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            const hash = window.location.hash;
            if (hash && (
              hash.includes('invite_token') ||
              hash.includes('confirmation_token') ||
              hash.includes('recovery_token')
            )) {
              window.netlifyIdentity.open();
            }
          }
        });

        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    </script>

</body>
</html>
