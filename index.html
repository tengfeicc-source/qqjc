<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乔乔竞彩总进球</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-alt: #1a1a26;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.1);
            --gold: #f0c040;
            --gold-dim: rgba(240, 192, 64, 0.15);
            --green: #34d399;
            --green-dim: rgba(52, 211, 153, 0.12);
            --red: #f87171;
            --red-dim: rgba(248, 113, 113, 0.12);
            --orange: #fb923c;
            --orange-dim: rgba(251, 146, 60, 0.12);
            --text: #e8e6e3;
            --text-muted: #8a8a9a;
            --text-dim: #55556a;
            --accent: #7c6ef0;
            --accent-dim: rgba(124, 110, 240, 0.12);
            --hero-grad: linear-gradient(135deg, #fff 30%, var(--gold) 100%);
            --badge-grad: linear-gradient(135deg, var(--gold), #e6a817);
            --badge-color: #000;
            --table-header-bg: var(--surface-alt);
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            --glow-1: rgba(124, 110, 240, 0.08);
            --glow-2: rgba(240, 192, 64, 0.05);
            --glow-3: rgba(52, 211, 153, 0.03);
            --toggle-bg: var(--surface-alt);
            --noise-opacity: 0.03;
        }

        [data-theme="light"] {
            --bg: #f4f1ec;
            --surface: #ffffff;
            --surface-alt: #faf8f5;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.14);
            --gold: #c8951a;
            --gold-dim: rgba(200, 149, 26, 0.1);
            --green: #059669;
            --green-dim: rgba(5, 150, 105, 0.1);
            --red: #dc2626;
            --red-dim: rgba(220, 38, 38, 0.08);
            --orange: #ea580c;
            --orange-dim: rgba(234, 88, 12, 0.1);
            --text: #1a1a2e;
            --text-muted: #64648a;
            --text-dim: #9a9ab0;
            --accent: #6c5ce7;
            --accent-dim: rgba(108, 92, 231, 0.1);
            --hero-grad: linear-gradient(135deg, #000 30%, var(--gold) 100%);
            --badge-grad: linear-gradient(135deg, var(--gold), #b8860b);
            --badge-color: #fff;
            --table-header-bg: #f0ede8;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --glow-1: rgba(108, 92, 231, 0.06);
            --glow-2: rgba(200, 149, 26, 0.04);
            --glow-3: rgba(5, 150, 105, 0.02);
            --toggle-bg: #e8e4de;
            --noise-opacity: 0.015;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.4s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(ellipse at 20% 0%, var(--glow-1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, var(--glow-2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, var(--glow-3) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
            transition: background 0.5s ease;
        }

        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0;
            opacity: var(--noise-opacity);
        }

        .wrapper {
            position: relative; z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        .theme-toggle {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 100;
            width: 48px; height: 48px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--toggle-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover { transform: scale(1.08); border-color: var(--border-hover); }
        .theme-toggle:active { transform: scale(0.95); }

        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            position: absolute;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0); }
        .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }

        [data-theme="light"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
        [data-theme="light"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0); }

        .hero {
            text-align: center;
            padding: 48px 20px 40px;
        }

        .hero-logo {
            width: 100px; height: 100px;
            border-radius: 24px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px var(--border);
            opacity: 0;
            animation: scaleIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .hero-logo:hover { transform: scale(1.05) rotate(2deg); }

        .hero h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: var(--hero-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.2s forwards;
        }

        .hero-sub {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.3s forwards;
        }

        .meta-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.4s forwards;
        }

        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .meta-chip .label { color: var(--text-dim); font-size: 11px; }
        .meta-chip .value { font-family: 'DM Mono', monospace; color: var(--text); font-size: 12px; }

        .live-clock {
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.5s forwards;
        }

        .clock-dot {
            width: 7px; height: 7px;
            background: var(--green);
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
            box-shadow: 0 0 8px var(--green);
        }

        .clock-label { font-size: 11px; color: var(--text-dim); font-weight: 500; }
        .clock-time { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--green); font-weight: 500; letter-spacing: 0.5px; }
        .clock-separator { color: var(--text-dim); font-size: 11px; }
        .clock-date { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); }

        .section {
            margin-top: 32px;
            opacity: 0;
            animation: fadeUp 0.7s ease forwards;
        }

        .section:nth-child(2) { animation-delay: 0.5s; }
        .section:nth-child(3) { animation-delay: 0.65s; }
        .section:nth-child(4) { animation-delay: 0.8s; }
        .section:nth-child(5) { animation-delay: 0.95s; }
        .section:nth-child(6) { animation-delay: 1.1s; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .section-icon {
            width: 32px; height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 16px;
            flex-shrink: 0;
        }

        .section-icon.gold { background: var(--gold-dim); }
        .section-icon.green { background: var(--green-dim); }
        .section-icon.red { background: var(--red-dim); }
        .section-icon.accent { background: var(--accent-dim); }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.3px;
        }

        .section-title .sub {
            font-weight: 400;
            color: var(--text-dim);
            font-size: 12px;
            margin-left: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 12px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 2px;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:nth-child(1)::before { background: var(--gold); }
        .stat-card:nth-child(2)::before { background: var(--accent); }
        .stat-card:nth-child(3)::before { background: var(--green); }
        .stat-card:nth-child(4)::before { background: orange; }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow);
        }

        .stat-card:hover::before { opacity: 1; }

        .stat-value {
            font-family: 'DM Mono', monospace;
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-card:nth-child(1) .stat-value { color: var(--gold); }
        .stat-card:nth-child(2) .stat-value { color: var(--accent); }
        .stat-card:nth-child(3) .stat-value { color: var(--green); }
        .stat-card:nth-child(4) .stat-value { color: orange; }

        .stat-label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .league-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .league-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            text-decoration: none;
            color: inherit;
        }

        .league-item:hover {
            border-color: var(--border-hover);
            background: var(--surface-alt);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .league-item:active { transform: translateY(0); }

        .league-name { font-size: 13px; font-weight: 600; color: var(--text); }

        .league-count {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 3px 10px;
            border-radius: 100px;
            font-weight: 500;
        }

        .rec-list { display: flex; flex-direction: column; gap: 10px; }

        .rec-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
        }

        .rec-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: 3px 0 0 3px;
            background: linear-gradient(180deg, var(--gold), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .rec-item:hover {
            transform: translateX(4px);
            border-color: var(--border-hover);
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .rec-item:hover::before { opacity: 1; }

        .rec-icon {
            font-size: 22px;
            width: 40px; height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-alt);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .rec-info { flex: 1; min-width: 0; }

        .rec-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rec-badge {
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            background: var(--badge-grad);
            color: var(--badge-color);
            padding: 6px 16px;
            border-radius: 100px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        /* 链接指示器 */
        .has-link::after {
            content: '↗';
            font-size: 11px;
            color: var(--text-dim);
            margin-left: 6px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .has-link:hover::after { opacity: 1; }

        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .record-table {
            width: 100%;
            min-width: 520px;
            border-collapse: collapse;
            font-size: 13px;
        }

        .record-table thead th {
            background: var(--table-header-bg);
            padding: 14px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            transition: background 0.4s ease;
            white-space: nowrap;
        }

        .record-table tbody td {
            padding: 14px 12px;
            text-align: center;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .record-table tbody tr:last-child td { border-bottom: none; }
        .record-table tbody tr:hover td { background: rgba(128,128,128,0.03); }

        /* 可点击行 */
        .record-table tbody tr.clickable-row {
            cursor: pointer;
        }

        .record-table tbody tr.clickable-row:hover td {
            background: rgba(124, 110, 240, 0.05);
        }

        .record-table tbody tr.clickable-row td a {
            color: inherit;
            text-decoration: none;
        }

        .record-table .link-icon {
            font-size: 10px;
            color: var(--accent);
            opacity: 0;
            margin-left: 4px;
            transition: opacity 0.2s ease;
        }

        .record-table tbody tr.clickable-row:hover .link-icon {
            opacity: 1;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 100px;
            letter-spacing: 0.3px;
        }

        .badge-win { color: var(--green); background: var(--green-dim); }
        .badge-lose { color: var(--red); background: var(--red-dim); }
        .badge-pending { color: var(--orange); background: var(--orange-dim); }
        .badge-draw { color: var(--text-muted); background: rgba(128,128,128,0.08); }

        .tip-card {
            background: var(--surface);
            border: 1px solid rgba(248,113,113,0.15);
            border-radius: 16px;
            padding: 20px 22px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            transition: border-color 0.4s ease;
        }

        [data-theme="light"] .tip-card { border-color: rgba(220,38,38,0.15); }

        .tip-icon {
            font-size: 20px;
            width: 40px; height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--red-dim);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .tip-text { font-size: 13px; color: var(--text-muted); line-height: 1.8; }
        .tip-text strong { color: var(--red); font-weight: 600; }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 24px;
            font-size: 12px;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
        }

        .footer span { color: var(--red); }

        .scroll-hint {
            display: none;
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: var(--text-dim);
            background: var(--surface-alt);
            border-top: 1px solid var(--border);
        }

        .scroll-hint::before {
            content: '← 横向滑动查看完整表格 →';
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 90%;
            max-width: 520px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: var(--shadow);
            transform: scale(0.95) translateY(10px);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .modal-close {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text);
            border-color: var(--border-hover);
            background: var(--surface);
        }

        .modal-body {
            padding: 16px 24px 24px;
            overflow-y: auto;
            max-height: calc(80vh - 70px);
        }

        .match-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .match-item:last-child { border-bottom: none; }

        .match-item.has-link {
            cursor: pointer;
            padding: 16px 10px;
            border-radius: 10px;
            margin: 0 -10px;
        }

        .match-item.has-link:hover {
            background: rgba(124, 110, 240, 0.05);
        }

        .match-teams {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .match-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
            flex-wrap: wrap;
            align-items: center;
        }

        .match-prediction {
            font-family: 'DM Mono', monospace;
            color: var(--gold);
            font-weight: 600;
        }

        .match-status-tag {
            padding: 2px 10px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 600;
        }

        .match-status-tag.ended {
            background: var(--green-dim);
            color: var(--green);
        }

        .match-status-tag.upcoming {
            background: var(--orange-dim);
            color: var(--orange);
        }

        .match-status-tag.live {
            background: var(--red-dim);
            color: var(--red);
            animation: blink 1.5s ease-in-out infinite;
        }

        .match-link-hint {
            font-size: 10px;
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .match-item.has-link:hover .match-link-hint {
            opacity: 1;
        }

        .modal-empty {
            text-align: center;
            color: var(--text-dim);
            padding: 40px 0;
            font-size: 13px;
        }

        .modal-count-badge {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--accent);
            font-weight: 500;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) and (min-width: 641px) {
            .wrapper { padding: 20px 24px 50px; }
            .hero h1 { font-size: 28px; }
            .stat-value { font-size: 26px; }
        }

        @media (max-width: 640px) {
            .wrapper { padding: 16px 12px 40px; }
            .hero { padding: 36px 12px 30px; }
            .hero h1 { font-size: 24px; }
            .hero-logo { width: 80px; height: 80px; border-radius: 20px; }
            .hero-sub { font-size: 12px; }
            .meta-row { gap: 8px; }
            .meta-chip { padding: 5px 10px; font-size: 11px; }
            .live-clock { gap: 5px; font-size: 11px; }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat-card { padding: 16px 10px; border-radius: 14px; }
            .stat-value { font-size: 22px; }
            .stat-label { font-size: 10px; }
            .league-grid { grid-template-columns: 1fr; gap: 8px; }
            .league-item { padding: 12px 14px; }
            .rec-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 14px 16px;
            }
            .rec-badge { align-self: flex-start; }
            .record-table { min-width: 480px; font-size: 12px; }
            .record-table thead th,
            .record-table tbody td { padding: 10px 8px; }
            .scroll-hint { display: block; }
            .section { margin-top: 24px; }
            .section-title { font-size: 14px; }
            .section-title .sub { display: none; }
            .theme-toggle {
                width: 40px; height: 40px;
                top: 12px; right: 12px;
                font-size: 18px;
                border-radius: 12px;
            }
            .tip-card { padding: 16px 14px; gap: 10px; border-radius: 14px; }
            .tip-icon { width: 34px; height: 34px; font-size: 16px; }
            .tip-text { font-size: 12px; }
            .modal-content { width: 94%; border-radius: 14px; }
            .modal-header { padding: 16px 18px; }
            .modal-header h3 { font-size: 16px; }
            .modal-body { padding: 12px 18px 18px; }
        }

        @media (max-width: 360px) {
            .wrapper { padding: 12px 8px 32px; }
            .hero { padding: 28px 8px 24px; }
            .hero h1 { font-size: 20px; }
            .hero-logo { width: 68px; height: 68px; border-radius: 16px; }
            .meta-row { flex-direction: column; align-items: center; gap: 6px; }
            .meta-chip { font-size: 10px; padding: 4px 8px; }
            .stats-grid { gap: 8px; }
            .stat-card { padding: 12px 6px; border-radius: 12px; }
            .stat-value { font-size: 18px; margin-bottom: 6px; }
            .stat-label { font-size: 9px; }
            .section-header { margin-bottom: 10px; }
            .section-icon { width: 28px; height: 28px; font-size: 14px; }
            .section-title { font-size: 13px; }
            .rec-icon { width: 34px; height: 34px; font-size: 18px; }
            .rec-name { font-size: 13px; }
            .rec-badge { font-size: 12px; padding: 5px 12px; }
            .record-table { min-width: 440px; font-size: 11px; }
            .record-table thead th,
            .record-table tbody td { padding: 8px 6px; }
            .theme-toggle {
                width: 36px; height: 36px;
                top: 10px; right: 10px;
                font-size: 16px;
                border-radius: 10px;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .hero { padding: 20px 12px; }
            .hero-logo { width: 50px; height: 50px; border-radius: 14px; margin-bottom: 10px; }
            .hero h1 { font-size: 20px; margin-bottom: 4px; }
            .hero-sub { font-size: 11px; }
            .meta-row { margin-top: 10px; }
            .live-clock { margin-top: 8px; }
            .section { margin-top: 20px; }
            .stat-card { padding: 12px 8px; }
            .stat-value { font-size: 20px; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="切换主题">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
    </button>

    <div class="wrapper">
        <div class="hero">
            <img src="/二维码.jpg" alt="乔乔竞彩" class="hero-logo" id="heroLogo">
            <h1>乔乔竞彩总进球</h1>
            <div class="hero-sub">乔乔竞彩足球预测 · 总进球预测</div>
            <div class="meta-row">
                <div class="meta-chip">
                    <span class="label">统计周期</span>
                    <span class="value" id="period">--</span>
                </div>
                <div class="meta-chip">
                    <span class="label">总场次</span>
                    <span class="value" id="totalMatches">--</span>
                </div>
            </div>
            <div class="live-clock">
                <div class="clock-dot"></div>
                <span class="clock-label">已同步</span>
                <span class="clock-time" id="clockTime">--:--:--</span>
                <span class="clock-separator">|</span>
                <span class="clock-date" id="clockDate">----/--/--</span>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-icon gold">📊</div>
                <div class="section-title">胜率统计</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="winRate">--</div><div class="stat-label">胜率</div></div>
                <div class="stat-card"><div class="stat-value" id="totalPredict">--</div><div class="stat-label">预测场次</div></div>
                <div class="stat-card"><div class="stat-value" id="winCount">--</div><div class="stat-label">命中</div></div>
                <div class="stat-card"><div class="stat-value" id="streak">--</div><div class="stat-label">当前连红</div></div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-icon accent">🏆</div>
                <div class="section-title">热门联赛</div>
            </div>
            <div class="league-grid" id="leagueList">
                <div class="league-item"><span class="league-name">加载中...</span><span class="league-count">--</span></div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-icon gold">🔥</div>
                <div class="section-title">今日推荐<span class="sub">精选赛事</span></div>
            </div>
            <div class="rec-list" id="recommendList">
                <div class="rec-item">
                    <div class="rec-icon">⏳</div>
                    <div class="rec-info"><div class="rec-name">数据加载中...</div></div>
                    <span class="rec-badge">--</span>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-icon green">📋</div>
                <div class="section-title">比赛记录</div>
            </div>
            <div class="table-wrap">
                <div class="table-scroll">
                    <table class="record-table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>联赛</th>
                                <th>比赛双方</th>
                                <th>比分</th>
                                <th>进球</th>
                                <th>结果</th>
                            </tr>
                        </thead>
                        <tbody id="recordBody">
                            <tr><td colspan="6" style="color:var(--text-dim);padding:30px">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="scroll-hint"></div>
            </div>
        </div>

        <div class="section">
            <div class="tip-card">
                <div class="tip-icon">💡</div>
                <div class="tip-text"><strong>温馨提示：</strong>比赛难测，预测多是概率游戏。理性看待，娱乐为主，切勿上头！</div>
            </div>
        </div>

        <div class="footer">© 2026 乔乔竞彩 · 仅供娱乐参考 <span>❤️</span></div>
    </div>

    <!-- 联赛详情模态窗口 -->
    <div class="modal-overlay" id="leagueModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 id="modalLeagueName">联赛详情</h3>
                    <span class="modal-count-badge" id="modalCountBadge"></span>
                </div>
                <button class="modal-close" onclick="closeLeagueModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalMatchList"></div>
        </div>
    </div>

    <script>
        // ===== 全局数据 =====
        var leaguesData = [];
        var globalSiteLink = '';

        // ===== 主题切换 =====
        function toggleTheme() {
            var html = document.documentElement;
            var next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }
        (function() {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
        })();

        // ===== 实时时钟 =====
        function updateClock() {
            var now = new Date();
            var h = String(now.getHours()).padStart(2, '0');
            var m = String(now.getMinutes()).padStart(2, '0');
            var s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockTime').textContent = h + ':' + m + ':' + s;
            var y = now.getFullYear();
            var mo = String(now.getMonth() + 1).padStart(2, '0');
            var d = String(now.getDate()).padStart(2, '0');
            var w = ['日','一','二','三','四','五','六'][now.getDay()];
            document.getElementById('clockDate').textContent = y + '/' + mo + '/' + d + ' 周' + w;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ===== 数字动画 =====
        function animateValue(id, start, end, dur, suf) {
            suf = suf || '';
            var el = document.getElementById(id);
            if (!el) return;
            var t0 = null;
            function step(ts) {
                if (!t0) t0 = ts;
                var p = Math.min((ts - t0) / dur, 1);
                el.textContent = Math.floor((1 - Math.pow(1 - p, 3)) * (end - start) + start) + suf;
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        // ===== 根据比赛记录自动计算统计 =====
        function calcStatsFromRecords(records) {
            if (!records || records.length === 0) {
                return { winRate: 0, totalPredict: 0, winCount: 0, streak: 0 };
            }
            var decided = records.filter(function(r) {
                return r.result === '胜' || r.result === '负' || r.result === '平';
            });
            var totalPredict = decided.length;
            var winCount = decided.filter(function(r) { return r.result === '胜'; }).length;
            var winRate = totalPredict > 0 ? Math.round((winCount / totalPredict) * 100) : 0;
            var streak = 0;
            for (var i = 0; i < decided.length; i++) {
                if (decided[i].result === '胜') {
                    streak++;
                } else {
                    break;
                }
            }
            return { winRate: winRate, totalPredict: totalPredict, winCount: winCount, streak: streak };
        }

        // ===== 根据比赛记录自动统计联赛 =====
        function calcLeaguesFromRecords(records) {
            if (!records || records.length === 0) return [];
            var leagueMap = {};
            var leagueOrder = [];
            records.forEach(function(r) {
                if (!r.league) return;
                if (!leagueMap[r.league]) {
                    leagueMap[r.league] = { name: r.league, count: 0, matches: [], link: '' };
                    leagueOrder.push(r.league);
                }
                leagueMap[r.league].count++;
                leagueMap[r.league].matches.push({
                    teams: r.teams,
                    time: r.date || '--',
                    prediction: r.goals || '--',
                    status: r.result === '待中' ? '未开始' : (r.score && r.score !== '未开始' ? '已结束' : '未开始'),
                    score: r.score || '--',
                    link: r.link || ''
                });
            });
            return leagueOrder.map(function(name) { return leagueMap[name]; });
        }

        // ===== 安全打开链接 =====
        function openLink(url) {
            if (url) {
                window.open(url, '_blank', 'noopener,noreferrer');
            }
        }

        // ===== 加载数据 =====
        function loadData() {
            fetch('/data.json')
                .then(function(r) { return r.json(); })
                .then(function(data) {

                    // 全站链接
                    globalSiteLink = data.siteLink || '';

                    // Logo链接
                    if (globalSiteLink) {
                        document.getElementById('heroLogo').style.cursor = 'pointer';
                        document.getElementById('heroLogo').onclick = function() { openLink(globalSiteLink); };
                    }

                    // 1. 统计周期
                    document.getElementById('period').textContent = data.period || '--';

                    // 2. 渲染比赛记录
                    var records = data.records || [];
                    document.getElementById('totalMatches').textContent = records.length;

                    if (records.length > 0) {
                        document.getElementById('recordBody').innerHTML = records.map(function(r) {
                            var bc = r.result === '胜' ? 'badge-win' : r.result === '负' ? 'badge-lose' : r.result === '待中' ? 'badge-pending' : 'badge-draw';
                            var sc = r.score === '未开始' ? '<span class="badge badge-pending">⏳ 未开始</span>' : r.score;
                            var rowClass = r.link ? ' class="clickable-row"' : '';
                            var linkIcon = r.link ? '<span class="link-icon">↗</span>' : '';
                            var onclick = r.link ? ' onclick="openLink(\'' + r.link + '\')"' : '';
                            return '<tr' + rowClass + onclick + '>' +
                                '<td>' + r.date + '</td>' +
                                '<td>' + r.league + '</td>' +
                                '<td style="text-align:left;font-weight:500;color:var(--text)">' + r.teams + linkIcon + '</td>' +
                                '<td>' + sc + '</td>' +
                                '<td style="font-family:DM Mono,monospace;font-weight:600">' + r.goals + '</td>' +
                                '<td><span class="badge ' + bc + '">' + r.result + '</span></td></tr>';
                        }).join('');
                    } else {
                        document.getElementById('recordBody').innerHTML = '<tr><td colspan="6" style="color:var(--text-dim);padding:30px">暂无比赛记录</td></tr>';
                    }

                    // 3. 自动计算胜率统计
                    var stats = calcStatsFromRecords(records);
                    animateValue('winRate', 0, stats.winRate, 1200, '%');
                    animateValue('totalPredict', 0, stats.totalPredict, 1200);
                    animateValue('winCount', 0, stats.winCount, 1200);
                    animateValue('streak', 0, stats.streak, 800);

                    // 4. 联赛数据
                    if (data.leagues && data.leagues.length > 0) {
                        leaguesData = data.leagues;
                    } else {
                        leaguesData = calcLeaguesFromRecords(records);
                    }
                    renderLeagues(leaguesData);

                    // 5. 今日推荐
                    if (data.recommendations && data.recommendations.length > 0) {
                        document.getElementById('recommendList').innerHTML = data.recommendations.map(function(item, i) {
                            var hasLink = item.link ? ' has-link' : '';
                            var linkTag = item.link ? 'a' : 'div';
                            var linkAttr = item.link ? ' href="' + item.link + '" target="_blank" rel="noopener noreferrer"' : '';
                            return '<' + linkTag + linkAttr + ' class="rec-item' + hasLink + '" style="animation:fadeUp 0.5s ease ' + (0.1*i) + 's both">' +
                                '<div class="rec-icon">' + item.icon + '</div>' +
                                '<div class="rec-info"><div class="rec-name">' + item.name + '</div></div>' +
                                '<span class="rec-badge">' + item.prediction + '</span></' + linkTag + '>';
                        }).join('');
                    } else {
                        document.getElementById('recommendList').innerHTML =
                            '<div class="rec-item"><div class="rec-icon">📭</div>' +
                            '<div class="rec-info"><div class="rec-name">暂无推荐</div></div></div>';
                    }
                })
                .catch(function() {
                    document.getElementById('recommendList').innerHTML =
                        '<div class="rec-item"><div class="rec-icon">⚠️</div>' +
                        '<div class="rec-info"><div class="rec-name">数据加载失败，请检查 data.json</div></div></div>';
                    document.getElementById('recordBody').innerHTML =
                        '<tr><td colspan="6" style="color:var(--text-dim);padding:30px">数据加载失败</td></tr>';
                });
        }

        // ===== 渲染联赛列表 =====
        function renderLeagues(leagues) {
            if (!leagues || leagues.length === 0) {
                document.getElementById('leagueList').innerHTML =
                    '<div class="league-item"><span class="league-name">暂无联赛数据</span><span class="league-count">0 场</span></div>';
                return;
            }
            document.getElementById('leagueList').innerHTML = leagues.map(function(league, index) {
                var hasLink = league.link ? ' has-link' : '';
                return '<div class="league-item' + hasLink + '" onclick="openLeagueModal(' + index + ')">' +
                    '<span class="league-name">' + league.name + '</span>' +
                    '<span class="league-count">' + league.count + ' 场</span></div>';
            }).join('');
        }

        // ===== 打开联赛详情模态窗口 =====
        function openLeagueModal(leagueIndex) {
            var league = leaguesData[leagueIndex];
            if (!league) return;

            document.getElementById('modalLeagueName').textContent = league.name;
            document.getElementById('modalCountBadge').textContent = '共 ' + league.count + ' 场比赛';

            var container = document.getElementById('modalMatchList');
            if (league.matches && league.matches.length > 0) {
                container.innerHTML = league.matches.map(function(match) {
                    var statusClass = match.status === '已结束' ? 'ended' : (match.status === '进行中' ? 'live' : 'upcoming');
                    var statusText = match.status || '未开始';
                    var hasLink = match.link ? ' has-link' : '';
                    var onclick = match.link ? ' onclick="openLink(\'' + match.link + '\')"' : '';
                    var linkHint = match.link ? '<span class="match-link-hint">点击查看详情 ↗</span>' : '';
                    return '<div class="match-item' + hasLink + '"' + onclick + '>' +
                        '<div class="match-teams">' + match.teams + '</div>' +
                        '<div class="match-meta">' +
                            '<span>⏰ ' + match.time + '</span>' +
                            (match.score && match.score !== '--' ? '<span>⚽ ' + match.score + '</span>' : '') +
                            '<span class="match-prediction">🎯 ' + match.prediction + '</span>' +
                            '<span class="match-status-tag ' + statusClass + '">' + statusText + '</span>' +
                            linkHint +
                        '</div></div>';
                }).join('');
            } else {
                container.innerHTML = '<div class="modal-empty">暂无详细比赛信息</div>';
            }

            var modal = document.getElementById('leagueModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ===== 关闭模态窗口 =====
        function closeLeagueModal() {
            var modal = document.getElementById('leagueModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('leagueModal').addEventListener('click', function(e) {
            if (e.target === this) closeLeagueModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLeagueModal();
        });

        // ===== 启动 =====
        loadData();
    </script>
</body>
</html>
