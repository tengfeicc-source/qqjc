<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
    .page { display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; text-align: center; max-width: 420px; width: 90%; }
    .box h2 { margin-bottom: 20px; color: #f0f6fc; font-size: 22px; }
    .box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #c9d1d9; font-size: 14px; outline: none; }
    .box input:focus { border-color: #58a6ff; }
    .box button { width: 100%; padding: 12px; margin-top: 16px; border: none; border-radius: 6px; background: #238636; color: #fff; font-size: 16px; cursor: pointer; font-weight: 600; }
    .box button:hover { background: #2ea043; }
    .box p { margin-top: 16px; font-size: 13px; color: #8b949e; }
    .box a { color: #58a6ff; text-decoration: none; }
    .admin { display: none; max-width: 960px; margin: 0 auto; padding: 30px 20px; }
    .admin h1 { color: #f0f6fc; margin-bottom: 20px; }
    .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
    .section h3 { color: #f0f6fc; margin-bottom: 16px; }
    label { display: block; color: #8b949e; font-size: 13px; margin-bottom: 4px; margin-top: 12px; }
    label:first-child { margin-top: 0; }
    .section input, .section select { width: 100%; padding: 10px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #c9d1d9; font-size: 14px; }
    .list-item { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 12px; position: relative; }
    .list-item .remove { position: absolute; top: 8px; right: 12px; background: #da3633; color: #fff; border: none; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
    .add-btn { background: transparent; border: 1px dashed #30363d; border-radius: 6px; padding: 10px; color: #58a6ff; cursor: pointer; width: 100%; font-size: 14px; }
    .add-btn:hover { border-color: #58a6ff; }
    .actions { display: flex; gap: 12px; margin-top: 20px; }
    .actions button { padding: 12px 28px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    .btn-save { background: #238636; color: #fff; }
    .btn-logout { background: #21262d; color: #f85149; border: 1px solid #30363d; }
    .sub-label { margin-top: 16px; font-weight: 600; color: #f0f6fc; font-size: 13px; padding-top: 12px; border-top: 1px solid #30363d; }

    /* Modal 样式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .modal-icon { font-size: 48px; margin-bottom: 16px; }
    .modal-title { font-size: 18px; font-weight: 600; color: #f0f6fc; margin-bottom: 8px; }
    .modal-message { font-size: 14px; color: #8b949e; margin-bottom: 20px; }
    .modal-btn {
      padding: 10px 32px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .modal-btn.ok { background: #238636; color: #fff; }
    .modal-btn.err { background: #da3633; color: #fff; }
    .modal-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="page" id="loginPage">
    <div class="box">
      <h2>后台管理登录</h2>
      <input type="password" id="tokenInput" placeholder="GitHub Personal Access Token" />
      <button onclick="doLogin()">登录</button>
      <p>首次使用请 <a href="https://github.com/settings/tokens/new?scopes=repo&description=admin" target="_blank">创建 Token</a>，勾选 repo 权限</p>
    </div>
  </div>
  <div class="admin" id="adminPage">
    <h1>网站数据管理</h1>
    <div class="section">
      <h3>基本设置</h3>
      <label>统计周期</label><input type="text" id="period" />
    </div>
    <div class="section">
      <h3>推荐列表</h3>
      <div id="recList"></div>
      <button class="add-btn" onclick="addRec()">+ 添加推荐项</button>
    </div>
    <div class="section">
      <h3>比赛记录</h3>
      <div id="recList2"></div>
      <button class="add-btn" onclick="addRecord()">+ 添加比赛记录</button>
    </div>
    <div class="section">
      <h3>热门联赛</h3>
      <div id="leagueList"></div>
      <button class="add-btn" onclick="addLeague()">+ 添加联赛</button>
    </div>
    <div class="actions">
      <button class="btn-save" onclick="doSave()">保存并提交</button>
      <button class="btn-logout" onclick="doLogout()">退出登录</button>
    </div>
  </div>

  <!-- 提示弹出框 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-icon" id="modalIcon">✅</div>
      <div class="modal-title" id="modalTitle">提示</div>
      <div class="modal-message" id="modalMessage">消息内容</div>
      <button class="modal-btn ok" id="modalBtn" onclick="closeModal()">确定</button>
    </div>
  </div>

  <script>
    var REPO='tengfeicc-source/qqjc',BRANCH='main',FILE='data.json';
    var TOKEN=localStorage.getItem('gh_token')||'',SHA='';

    // 显示弹出框
    function showModal(type, title, message){
      var modal = document.getElementById('modal');
      var icon = document.getElementById('modalIcon');
      var titleEl = document.getElementById('modalTitle');
      var msgEl = document.getElementById('modalMessage');
      var btn = document.getElementById('modalBtn');

      if(type === 'ok'){
        icon.textContent = '✅';
        btn.className = 'modal-btn ok';
      }else if(type === 'err'){
        icon.textContent = '❌';
        btn.className = 'modal-btn err';
      }else if(type === 'info'){
        icon.textContent = 'ℹ️';
        btn.className = 'modal-btn ok';
      }

      titleEl.textContent = title;
      msgEl.textContent = message;
      modal.classList.add('show');
    }

    function closeModal(){
      document.getElementById('modal').classList.remove('show');
    }

    function doLogin(){
      TOKEN=document.getElementById('tokenInput').value.trim();
      if(!TOKEN){
        showModal('err', '错误', '请输入 GitHub Token');
        return;
      }
      localStorage.setItem('gh_token',TOKEN);
      loadData();
    }

    function doLogout(){
      localStorage.removeItem('gh_token');
      TOKEN='';
      document.getElementById('loginPage').style.display='flex';
      document.getElementById('adminPage').style.display='none';
    }

    async function loadData(){
      try{
        var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,{
          headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github.v3.json'}
        });
        if(r.status===401){
          showModal('err', '登录失败', 'Token 无效，请重新登录');
          doLogout();
          return;
        }
        if(!r.ok){
          showModal('err', '加载失败', '状态码: '+r.status);
          return;
        }
        var d=await r.json();
        SHA=d.sha;
        var j=JSON.parse(decodeURIComponent(escape(atob(d.content))));
        render(j);
        document.getElementById('loginPage').style.display='none';
        document.getElementById('adminPage').style.display='block';
      }catch(e){
        showModal('err', '错误', e.message);
      }
    }

    function render(d){
      document.getElementById('period').value=d.period||'';
      document.getElementById('recList').innerHTML='';
      (d.recommendations||[]).forEach(function(r){addRec(r);});
      document.getElementById('recList2').innerHTML='';
      (d.records||[]).forEach(function(r){addRecord(r);});
      document.getElementById('leagueList').innerHTML='';
      (d.leagues||[]).forEach(function(l){addLeague(l);});
    }

    function addRec(d){
      d=d||{};
      var e=document.createElement('div');
      e.className='list-item';
      e.innerHTML='<button class="remove" onclick="this.parentElement.remove()">删除</button>'+
        '<label>图标</label><input class="r-icon" value="'+(d.icon||'⭐')+'">'+
        '<label>比赛名称</label><input class="r-name" value="'+(d.name||'')+'">'+
        '<label>预测结果</label><input class="r-pred" value="'+(d.prediction||'')+'">'+
        '<label>跳转链接</label><input class="r-link" value="'+(d.link||'')+'">';
      document.getElementById('recList').appendChild(e);
    }

    function addRecord(d){
      d=d||{};
      var e=document.createElement('div');
      e.className='list-item';
      e.innerHTML='<button class="remove" onclick="this.parentElement.remove()">删除</button>'+
        '<label>日期</label><input class="c-date" value="'+(d.date||'')+'">'+
        '<label>联赛</label><input class="c-league" value="'+(d.league||'')+'">'+
        '<label>比赛双方</label><input class="c-teams" value="'+(d.teams||'')+'">'+
        '<label>比分</label><input class="c-score" value="'+(d.score||'')+'">'+
        '<label>进球预测</label><input class="c-goals" value="'+(d.goals||'')+'">'+
        '<label>结果</label><select class="c-result">'+
          '<option value="胜"'+(d.result==='胜'?' selected':'')+'>命中</option>'+
          '<option value="负"'+(d.result==='负'?' selected':'')+'>未中</option>'+
          '<option value="待中"'+(d.result==='待中'?' selected':'')+'>待定</option>'+
          '<option value="平"'+(d.result==='平'?' selected':'')+'>平</option>'+
        '</select>'+
        '<label>跳转链接</label><input class="c-link" value="'+(d.link||'')+'">';
      document.getElementById('recList2').appendChild(e);
    }

    function addLeague(data){
      data=data||{};
      var div=document.createElement('div');
      div.className='list-item';
      div.innerHTML=
        '<button class="remove" onclick="this.parentElement.remove()">删除</button>'+
        '<label>联赛名称</label><input class="l-name" value="'+(data.name||'')+'">'+
        '<label>场次</label><input class="l-count" type="number" value="'+(data.count||0)+'">'+
        '<label>跳转链接</label><input class="l-link" value="'+(data.link||'')+'">'+
        '<label class="sub-label">该联赛下的比赛</label>'+
        '<div class="l-matches"></div>'+
        '<button class="add-btn" onclick="addLeagueMatch(this)" style="margin-top:8px">+ 添加比赛</button>';
      document.getElementById('leagueList').appendChild(div);
      if(data.matches&&data.matches.length>0){
        data.matches.forEach(function(m){addLeagueMatch(div.querySelector('.add-btn'),m);});
      }
    }

    function addLeagueMatch(btn,data){
      data=data||{};
      var container=btn.previousElementSibling;
      if(!container){
        console.error('找不到容器元素');
        return;
      }
      var div=document.createElement('div');
      div.className='list-item';
      div.style.marginTop='8px';
      div.innerHTML=
        '<button class="remove" onclick="this.parentElement.remove()">删除</button>'+
        '<label>比赛双方</label><input class="lm-teams" value="'+(data.teams||'')+'">'+
        '<label>时间</label><input class="lm-time" value="'+(data.time||'')+'">'+
        '<label>跳转链接</label><input class="lm-link" value="'+(data.link||'')+'">';
      container.appendChild(div);
    }

    // 安全获取值的函数
    function getSafeValue(element, selector) {
      if (!element) return '';
      var el = element.querySelector(selector);
      return el ? el.value : '';
    }

    function collect(){
      var r=[];
      var recItems = document.querySelectorAll('#recList .list-item');
      for(var i=0; i<recItems.length; i++){
        var e = recItems[i];
        r.push({
          icon:getSafeValue(e, '.r-icon'),
          name:getSafeValue(e, '.r-name'),
          prediction:getSafeValue(e, '.r-pred'),
          link:getSafeValue(e, '.r-link') || undefined
        });
      }

      var c=[];
      var recordItems = document.querySelectorAll('#recList2 .list-item');
      for(var j=0; j<recordItems.length; j++){
        var e2 = recordItems[j];
        c.push({
          date:getSafeValue(e2, '.c-date'),
          league:getSafeValue(e2, '.c-league'),
          teams:getSafeValue(e2, '.c-teams'),
          score:getSafeValue(e2, '.c-score'),
          goals:getSafeValue(e2, '.c-goals'),
          result:getSafeValue(e2, '.c-result'),
          link:getSafeValue(e2, '.c-link') || undefined
        });
      }

      var leagues=[];
      var leagueItems = document.querySelectorAll('#leagueList .list-item');
      for(var k=0; k<leagueItems.length; k++){
        var e3 = leagueItems[k];
        var matches=[];
        var matchItems = e3.querySelectorAll('.l-matches .list-item');
        for(var m=0; m<matchItems.length; m++){
          var matchEl = matchItems[m];
          matches.push({
            teams:getSafeValue(matchEl, '.lm-teams'),
            time:getSafeValue(matchEl, '.lm-time'),
            link:getSafeValue(matchEl, '.lm-link') || ''
          });
        }
        var lName = e3.querySelector('.l-name');
        var lCount = e3.querySelector('.l-count');
        var lLink = e3.querySelector('.l-link');
        leagues.push({
          name: lName ? lName.value : '',
          count: lCount ? (parseInt(lCount.value) || matches.length) : matches.length,
          link: lLink ? lLink.value : '',
          matches: matches
        });
      }

      return{
        period:document:c,
        leagues:leagues.length.getElementById('period').value,
        recommendations:r,
        records>0?leagues:undefined
      };
    }

    async function doSave(){
      showModal('info', '保存中', '正在提交数据到 GitHub，请稍候...');

      var d=collect();
      var content=btoa(unescape(encodeURIComponent(JSON.stringify(d,null,2))));

      try{
        var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,{
          method:'PUT',
          headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github.v3.json','Content-Type':'application/json'},
          body:JSON.stringify({message:'Update data.json',content:content,sha:SHA,branch:BRANCH})
        });

        if(r.ok){
          var x=await r.json();
          SHA=x.content.sha;
          showModal('ok', '保存成功', '数据已成功提交到 GitHub');
        }else{
          var errorText = '保存失败: ' + r.status;
          try {
            var errorData = await r.json();
            errorText += ' - ' + (errorData.message || errorData.error || '未知错误');
          } catch(e) {}
          showModal('err', '保存失败', errorText);
        }
      }catch(e){
        showModal('err', '网络错误', e.message);
      }
    }

    if(TOKEN)loadData();
  </script>
</body>
</html>
