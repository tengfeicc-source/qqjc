<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; }
    .login-page { display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 40px; text-align: center; max-width: 400px; width: 90%; }
    .login-box h2 { margin-bottom: 20px; color: #f0f6fc; }
    .login-box input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #c9d1d9; font-size: 14px; }
    .login-box button { width: 100%; padding: 12px; margin-top: 16px; border: none; border-radius: 6px; background: #238636; color: #fff; font-size: 16px; cursor: pointer; }
    .login-box button:hover { background: #2ea043; }
    .login-box p { margin-top: 16px; font-size: 12px; color: #8b949e; }
    .admin-page { display: none; max-width: 900px; margin: 0 auto; padding: 20px; }
    .admin-page h1 { color: #f0f6fc; margin-bottom: 20px; }
    .admin-page textarea { width: 100%; height: 500px; padding: 16px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #c9d1d9; font-family: monospace; font-size: 13px; resize: vertical; }
    .admin-page .btn { padding: 10px 24px; border: none; border-radius: 6px; background: #238636; color: #fff; font-size: 14px; cursor: pointer; margin-top: 12px; margin-right: 8px; }
    .admin-page .btn:hover { background: #2ea043; }
    .admin-page .btn-danger { background: #da3633; }
    .admin-page .msg { margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
    .admin-page .msg.success { background: #0d4429; color: #3fb950; }
    .admin-page .msg.error { background: #490202; color: #f85149; }
  </style>
</head>
<body>

<!-- 登录页面 -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h2>后台管理登录</h2>
    <input type="text" id="tokenInput" placeholder="输入 GitHub Personal Access Token" />
    <button onclick="login()">登录</button>
    <p>需要 <a href="https://github.com/settings/tokens/new?scopes=repo&description=cms-admin" target="_blank" style="color:#58a6ff;">创建 Token</a>，勾选 repo 权限</p>
  </div>
</div>

<!-- 管理页面 -->
<div class="admin-page" id="adminPage">
  <h1>网站数据管理</h1>
  <div class="msg" id="msg"></div>
  <textarea id="editor"></textarea>
  <br>
  <button class="btn" onclick="saveData()">保存并提交</button>
  <button class="btn btn-danger" onclick="logout()">退出登录</button>
</div>

<script>
const REPO = 'tengfeicc-source/qqjc';
const BRANCH = 'main';
const FILE_PATH = 'data.json';
let token = localStorage.getItem('gh_token') || '';

function login() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) { alert('请输入 Token'); return; }
  localStorage.setItem('gh_token', token);
  loadEditor();
}

function logout() {
  localStorage.removeItem('gh_token');
  token = '';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('adminPage').style.display = 'none';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

async function loadEditor() {
  try {
    const res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + FILE_PATH, {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (res.status === 401) { alert('Token 无效，请重新登录'); logout(); return; }
    if (!res.ok) { alert('加载失败: ' + res.status); return; }
    const data = await res.json();
    const content = decodeURIComponent(escape(atob(data.content)));
    window._sha = data.sha;
    document.getElementById('editor').value = JSON.stringify(JSON.parse(content), null, 2);
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('adminPage').style.display = 'block';
  } catch (e) {
    alert('网络错误: ' + e.message);
  }
}

async function saveData() {
  const content = document.getElementById('editor').value;
  try { JSON.parse(content); } catch(e) { showMsg('JSON 格式错误: ' + e.message, 'error'); return; }
  try {
    const res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + FILE_PATH, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: 'Update data.json via admin',
        content: btoa(unescape(encodeURIComponent(content))),
        sha: window._sha,
        branch: BRANCH
      })
    });
    if (res.ok) {
      const result = await res.json();
      window._sha = result.content.sha;
      showMsg('保存成功！', 'success');
    } else {
      showMsg('保存失败: ' + res.status, 'error');
    }
  } catch (e) {
    showMsg('网络错误: ' + e.message, 'error');
  }
}

if (token) { loadEditor(); }
</script>
</body>
</html>
