<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "tengfeicc-source/qqjc",
          branch: "main",
          auth_endpoint: "https://qqjc-auth.jctj.workers.dev/auth"
        },
        media_folder: "images",
        public_folder: "/images",
        collections: [
          {
            name: "data",
            label: "网站数据管理",
            files: [
              {
                name: "site_data",
                label: "网站数据",
                file: "data.json",
                fields: [
                  { label: "统计周期", name: "period", widget: "string" },
                  { label: "站点Logo跳转链接", name: "siteLink", widget: "string", required: false },
                  {
                    label: "推荐列表",
                    name: "recommendations",
                    widget: "list",
                    fields: [
                      { label: "图标", name: "icon", widget: "string", default: "⭐" },
                      { label: "比赛名称", name: "name", widget: "string" },
                      { label: "预测结果", name: "prediction", widget: "string" },
                      { label: "跳转链接", name: "link", widget: "string", required: false }
                    ]
                  },
                  {
                    label: "比赛记录列表",
                    name: "records",
                    widget: "list",
                    fields: [
                      { label: "日期", name: "date", widget: "string" },
                      { label: "联赛", name: "league", widget: "string" },
                      { label: "比赛双方", name: "teams", widget: "string" },
                      { label: "比分", name: "score", widget: "string" },
                      { label: "进球预测", name: "goals", widget: "string" },
                      {
                        label: "结果", name: "result", widget: "select",
                        options: [
                          { label: "✅ 命中（胜）", value: "胜" },
                          { label: "❌ 未中（负）", value: "负" },
                          { label: "⏳ 待定", value: "待中" },
                          { label: "➖ 平", value: "平" }
                        ]
                      },
                      { label: "跳转链接", name: "link", widget: "string", required: false }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
